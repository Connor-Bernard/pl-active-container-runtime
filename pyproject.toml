[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "checkpoint"
version = "0.1.0"
authors = [
{name = "Your Name", email = "your.email@example.com"}
]
description = "A tool for terminal-based capture-the-flag assessments"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
"Development Status :: 3 - Alpha",
"Intended Audience :: Education",
"License :: OSI Approved :: MIT License",
"Programming Language :: Python :: 3",
"Topic :: Education :: Testing"
]
dependencies = [
"click>=8.0",
"docker",
"pydantic>=2.0",
"jinja2",
"terminado"
]

[project.scripts]
checkpoint = "checkpoint.cli:cli"

[project.urls]
Homepage = "https://github.com/yourusername/checkpoint"
"Bug Tracker" = "https://github.com/yourusername/checkpoint/issues"
